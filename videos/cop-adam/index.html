<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4efe6; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="stickman" data-composition-id="stickman" data-composition-src="compositions/stickman.html"
        data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="8.4" data-duration="1.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index: 2"></div>
      <audio id="music" class="clip" data-start="0" data-duration="10" data-track-index="2" data-volume="0.6" data-fade-out="0.8" src="assets/bgm/track.wav"></audio>
      <audio id="sfx-pop" class="clip" data-start="3.15" data-duration="0.72" data-track-index="3" data-volume="0.5" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-kick" class="clip" data-start="4.17" data-duration="0.57" data-track-index="3" data-volume="0.6" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-bonk" class="clip" data-start="6.38" data-duration="2.12" data-track-index="3" data-volume="0.5" src="assets/sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-stars" class="clip" data-start="6.5" data-duration="1.8" data-track-index="4" data-volume="0.35" src="assets/sfx/sparkle.mp3"></audio>
      <audio id="sfx-title" class="clip" data-start="8.4" data-duration="1.6" data-track-index="4" data-volume="0.4" src="assets/sfx/chime.mp3"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
